<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Ticker Tracker</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Stock Ticker Tracker</h1>
            <p class="subtitle">Real-time stock price monitoring and analytics</p>
        </header>

        <div class="controls">
            <button id="refreshBtn" class="btn btn-primary">🔄 Refresh Data</button>
            <div class="add-symbol-controls">
                <input type="text" id="newSymbolInput" placeholder="Enter symbol..." class="symbol-input">
                <button id="addSymbolBtn" class="btn btn-primary">Add Stock</button>
            </div>
            <div class="status">
                Status: <span id="trackerStatus" class="status-badge">Loading...</span>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stock cards will be inserted here -->
        </div>

        <div class="section">
            <h2>📈 Price History & Search</h2>

            <div class="search-container" style="margin-bottom: 1rem;">
                <input type="text" id="symbolSearch" placeholder="Search symbol or company..." autocomplete="off" style="padding: 8px; width: 300px;">
                <button id="searchBtn" class="btn btn-primary">Search</button>
            </div>
            <div id="searchResults" class="search-results" style="margin-bottom: 1rem;"></div>

            <section class="chart-section" style="margin-top: 2rem; display: none;" id="chartContainer">
                <div class="chart-header">
                    <h2 id="chartTitle">Stock Price History (YTD)</h2>
                </div>
                <div class="chart-wrapper" style="position: relative; height: 400px; width: 100%;">
                    <canvas id="stockChart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/app.js"></script>
</body>
</html>
